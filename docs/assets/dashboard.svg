<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="slo-burn example evaluation">
<rect width="900" height="420" fill="#020617"/>
<text x="28" y="36" fill="#94a3b8" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif" letter-spacing="1.6">SLO-BURN  ·  EXAMPLE EVALUATION  ·  99.99% / 30d</text>
<text x="28" y="70" fill="#e2e8f0" font-size="22" font-weight="700" font-family="ui-sans-serif,system-ui,sans-serif">Page on time remaining, not on a 5-minute blip</text>
<rect x="28" y="96" width="270" height="88" rx="10" fill="#0f172a" stroke="#334155"/>
<text x="44" y="122" fill="#94a3b8" font-size="11" font-family="ui-sans-serif,system-ui,sans-serif">ALLOWED DOWNTIME</text>
<text x="44" y="162" fill="#e2e8f0" font-size="28" font-weight="700" font-family="ui-monospace,monospace">4.32 min</text>
<rect x="314" y="96" width="270" height="88" rx="10" fill="#0f172a" stroke="#334155"/>
<text x="330" y="122" fill="#94a3b8" font-size="11" font-family="ui-sans-serif,system-ui,sans-serif">BURN RATE  14.4×</text>
<text x="330" y="162" fill="#f87171" font-size="28" font-weight="700" font-family="ui-monospace,monospace">PAGE</text>
<rect x="600" y="96" width="272" height="88" rx="10" fill="#0f172a" stroke="#334155"/>
<text x="616" y="122" fill="#94a3b8" font-size="11" font-family="ui-sans-serif,system-ui,sans-serif">HOURS TO BUDGET EXHAUSTION</text>
<text x="616" y="162" fill="#fbbf24" font-size="28" font-weight="700" font-family="ui-monospace,monospace">25.0 h</text>
<rect x="28" y="208" width="844" height="160" rx="10" fill="#0f172a" stroke="#334155"/>
<text x="44" y="236" fill="#94a3b8" font-size="11" font-family="ui-sans-serif,system-ui,sans-serif" letter-spacing="0.8">MULTI-WINDOW RULE (GOOGLE SRE WORKBOOK)</text>
<text x="44" y="272" fill="#e2e8f0" font-size="15" font-family="ui-sans-serif,system-ui,sans-serif">Page fires only when the 1h window AND the 5h window both exceed 14×.</text>
<text x="44" y="300" fill="#94a3b8" font-size="14" font-family="ui-sans-serif,system-ui,sans-serif">A 90-second CPU spike clears the long window. A slow 0.3% error burn does not.</text>
<text x="44" y="336" fill="#e2e8f0" font-size="14" font-family="ui-sans-serif,system-ui,sans-serif">Ticket path: 3× on 6h / 3d — create work, do not wake someone.</text>
<text x="28" y="400" fill="#475569" font-size="11" font-family="ui-sans-serif,system-ui,sans-serif">Numbers from hours_to_budget_exhaustion(0.5, 14.4) and allowed_downtime_minutes(99.99, 30). Not a live cluster.</text>
</svg>
