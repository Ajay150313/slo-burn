[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slo-burn"
version = "0.3.0"
description = "Multi-window SLO burn rate alerting — stop alert fatigue, catch every real incident"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Ajay Devineni" }]
requires-python = ">=3.9"
keywords = ["sre", "slo", "sli", "burn-rate", "alerting", "reliability", "prometheus", "observability", "devops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]
dashboard = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[project.urls]
Homepage      = "https://github.com/Ajay150313/slo-burn"
Repository    = "https://github.com/Ajay150313/slo-burn"
"Bug Tracker" = "https://github.com/Ajay150313/slo-burn/issues"
Documentation = "https://github.com/Ajay150313/slo-burn/blob/main/docs/algorithm.md"
Changelog     = "https://github.com/Ajay150313/slo-burn/blob/main/CHANGELOG.md"

[project.scripts]
slo-burn = "src.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
